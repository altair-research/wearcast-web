<!doctype html>
<html lang="en">
<head>
  <base href="/wearcast-web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="What to wear for your weather. Explore outfits, hourly forecasts and personal check-ins with WearCast.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WearCast">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>WearCast</title>
  <style>
    html, body { margin:0; min-height:100%; background:#101318; }
    #boot { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; color:#e5e8ed; font:16px system-ui,sans-serif; text-align:center; padding:24px; }
    #boot h1 { font-size:28px; font-weight:600; margin:0; }
    #boot p { color:#a4acb8; margin:0; max-width:320px; }
    #boot img { width:72px; height:72px; border-radius:18px; }
    #boot button { padding:12px 22px; background:#9fc5f7; color:#101318; border:0; border-radius:24px; font:inherit; cursor:pointer; }
    .progress { width:100px; height:3px; background:#283545; border-radius:3px; overflow:hidden; }
    .progress::after { content:''; display:block; width:45%; height:100%; background:#9fc5f7; animation:loading 1.2s ease-in-out infinite alternate; }
    @keyframes loading { to { transform:translateX(125%); } }
    @media(prefers-reduced-motion:reduce) { .progress::after { animation:none; width:100%; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <h1>WearCast</h1>
    <p id="boot-message">Getting your wardrobe ready…</p>
    <div class="progress" id="boot-progress"></div>
    <button id="boot-retry" hidden onclick="location.reload()">Try again</button>
  </div>
  <script>
    const bootKorean = navigator.language.toLowerCase().startsWith('ko');
    if (bootKorean) {
      document.documentElement.lang = 'ko';
      document.getElementById('boot-message').textContent = '옷장을 준비하고 있어요…';
      document.getElementById('boot-retry').textContent = '다시 시도';
    }
    window.wearcastBootFailed = () => {
      if (!document.getElementById('boot')) return;
      document.getElementById('boot-message').textContent = bootKorean
        ? '앱을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'
        : 'Could not load the app. Check your connection and try again.';
      document.getElementById('boot-progress').hidden = true;
      document.getElementById('boot-retry').hidden = false;
    };
    window.wearcastBootTimeout = setTimeout(window.wearcastBootFailed, 45000);
  </script>
  <script src="flutter_bootstrap.js" async onerror="wearcastBootFailed()"></script>
  <noscript>WearCast needs JavaScript enabled to display your outfits and weather.</noscript>
</body>
</html>
